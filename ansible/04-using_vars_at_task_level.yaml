- name: variables
  hosts: web
  vars:
    COURSE: "AWS"
    DURATION: "120 hrs"
  tasks:
  - name: task level
    vars:
      COURSE: "Ansible"
    ansible.builtin.debug:
      msg: "I am learning {{COURSE}} with {{DURATION}}"

  - name: play level
    ansible.builtin.debug:
      msg: "I am learning {{COURSE}} with {{DURATION}}"