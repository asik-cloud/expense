- name: loops
  hosts: local
  connection: local
  become: yes
  tasks: 
  - name: Installing / Uninstalling packages
    ansible.builtin.package:
      name: "{{item.name}}"
      state: "{{item.state}}"
    loop:
    - {name: 'nginx', state: 'present'}
    - {name: 'mysql', state: 'present'}
    - {name: 'postfix', state: 'present'}
    - {name: 'git', state: 'absent'}