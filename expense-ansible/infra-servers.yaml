- name: servers and r53 records
  hosts: local
  connection: local
  vars:
    servers:
      - mysql
      - backend
      - frontend
    subnet_id: subnet-0c0eb462a5bd2e4bc
    sg_id: sg-01e389050814235b8
    img_id: ami-09c813fb71547fc4f
    zone: learncloudwithamk.shop
  tasks:
  - name: creating servers
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      vpc_subnet_id: "{{subnet_id}}"
      instance_type: t3.micro
      security_group: "{{sg_id}}"
      image_id: "{{img_id}}"
    loop: "{{ servers }}"
    register: instances_info

  - name: creating route53 records
    amazon.aws.route53:
      state: present
      zone: "{{zone}}"
      record: "{{item.item}}.{{zone}}"
      type: A
      ttl: 1
      value: "{{ item.servers[0].private_ip_address }}"
      wait: true
    loop: "{{ instances_info.results }}" 