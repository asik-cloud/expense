- name: mysql confifuration
  hosts: mysql
  become: yes
  vars: 
    host: "mysql.learncloudwithamk.shop"
    mysql_pwd: "ExpenseApp@1"
  tasks: 
  - name: install mysql server
    ansible.builtin.package:
      name: mysql-server
      state: present 
  - name: install Pymysql with pip 
    ansible.builtin.pip:
      name: PyMySQL
      executable: pip3.9
  - name: starting and enabling mysql
    ansible.builtin.service:
      name: mysqld
      state: restarted
      enabled: yes
  - name: Connecting to mysql
    community.mysql.mysql_info:
      login_user: root
      login_password: "{{ mysql_pwd }}"
      login_host: "{{ host }}"
    ignore_errors: true
    register: mysql_info

  - name: setting mysql root password 
    ansible.builtin.command: mysql_secure_installation --set-root-pass "{{ mysql_pwd }}"
    when: mysql_info.failed is true